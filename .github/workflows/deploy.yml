name: Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: ecom-web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Start Datastore emulator
        run: |
          docker run -d --name datastore -p 8081:8081 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators datastore start --host-port=0.0.0.0:8081 \
            --project=e-com-test --consistency=1.0 --no-store-on-disk
          for _ in $(seq 1 60); do curl -fs http://localhost:8081/ && exit 0; sleep 2; done
          docker logs datastore; exit 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATASTORE_EMULATOR_HOST: localhost:8081
          DATASTORE_PROJECT_ID: e-com-test
        run: pytest -q --cov=app --cov-report=term-missing

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # Workload Identity Federation: the deployer service account needs
      # roles/run.admin, roles/iam.serviceAccountUser, roles/secretmanager.viewer
      # and roles/storage.admin (source upload bucket). Run
      # ./scripts/deploy.sh once from a laptop first to provision everything.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and deploy
        env:
          ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
        run: ./scripts/deploy.sh ship
