<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Admin - {{ site_name }}{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/500.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/600.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body class="admin-body">
<div class="d-flex">
  <nav class="admin-sidebar text-white p-3 d-none d-lg-flex flex-column" style="width: 240px; position: sticky; top: 0; height: 100vh;">
    <a href="{{ url_for('admin.dashboard') }}" class="text-white text-decoration-none fs-5 fw-bold mb-4"><i class="bi bi-bag-heart-fill"></i> Admin panel</a>
    {% include "admin/_sidebar_links.html" %}
  </nav>

  <div class="flex-grow-1">
    <nav class="navbar navbar-light bg-white border-bottom px-3">
      <button class="btn btn-outline-secondary d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#adminSidebarOffcanvas">
        <i class="bi bi-list"></i>
      </button>
      <span class="navbar-brand mb-0 h1 fs-6 d-lg-none">Admin panel</span>
      <div class="ms-auto d-flex align-items-center gap-3">
        <span class="small text-muted d-none d-md-inline">{{ current_user.email }}</span>
        <a href="{{ url_for('shop.home') }}" class="btn btn-sm btn-outline-secondary" target="_blank"><i class="bi bi-box-arrow-up-right"></i> View site</a>
        <a href="{{ url_for('admin.logout') }}" class="btn btn-sm btn-outline-danger"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </div>
    </nav>

    <div class="offcanvas offcanvas-start admin-sidebar text-white" tabindex="-1" id="adminSidebarOffcanvas">
      <div class="offcanvas-header">
        <span class="fw-bold"><i class="bi bi-bag-heart-fill"></i> Admin panel</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
      </div>
      <div class="offcanvas-body">
        {% include "admin/_sidebar_links.html" %}
      </div>
    </div>

    <main class="p-3 p-md-4">
      {% include "partials/flash_messages.html" %}
      {% block admin_content %}{% endblock %}
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>window.CSRF_TOKEN = "{{ csrf_token() }}";</script>
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
