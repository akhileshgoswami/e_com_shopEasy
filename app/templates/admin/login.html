<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin login - {{ site_name }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.0.16/600.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/fraunces@5.0.16/700.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/500.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.0.16/600.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
<style>
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #1f2e27 0%, #0c1210 55%, #060908 100%);
    display: flex;
    align-items: center;
    font-family: var(--font-body);
  }
  .admin-login-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid rgba(184, 135, 63, 0.2);
    box-shadow: 0 1.5rem 4rem rgba(0, 0, 0, 0.45);
    padding: 2.75rem 2.5rem;
  }
  .admin-login-brand {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.6rem;
    color: var(--ink);
    text-align: center;
  }
  .admin-login-brand i { color: var(--gold); }
  .admin-login-eyebrow {
    text-align: center;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--gold-dark);
    margin-top: 0.35rem;
    margin-bottom: 2rem;
  }
  .back-to-site {
    display: block;
    text-align: center;
    margin-top: 1.5rem;
    color: #d9d2c2;
    font-size: 0.82rem;
    text-decoration: none;
  }
  .back-to-site:hover { color: var(--gold); }
</style>
</head>
<body>
<div class="container" style="max-width: 420px;">
  <div class="admin-login-card">
    <p class="admin-login-brand mb-0"><i class="bi bi-gem"></i> {{ site_name }}</p>
    <p class="admin-login-eyebrow">Admin access</p>

    {% include "partials/flash_messages.html" %}

    <form method="post">
      {{ form.hidden_tag() }}
      <div class="mb-3">
        <label class="form-label small fw-semibold text-uppercase" style="letter-spacing: 0.04em;">Email</label>
        {{ form.email(class="form-control", placeholder="you@example.com", autofocus=true) }}
      </div>
      <div class="mb-4">
        <label class="form-label small fw-semibold text-uppercase" style="letter-spacing: 0.04em;">Password</label>
        {{ form.password(class="form-control", placeholder="••••••••") }}
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
  <a href="{{ url_for('shop.home') }}" class="back-to-site"><i class="bi bi-arrow-left"></i> Back to store</a>
</div>
</body>
</html>
