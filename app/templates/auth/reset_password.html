{% extends "base.html" %}
{% import "partials/forms.html" as f %}
{% block title %}Reset password - {{ site_name }}{% endblock %}
{% block content %}
<div class="container py-5" style="max-width: 440px;">
  <div class="card card-body shadow-sm">
    <h1 class="h4 mb-4 text-center">Set a new password</h1>
    <form method="post">
      {{ form.hidden_tag() }}
      {{ f.render_field(form.password) }}
      {{ f.render_field(form.confirm_password) }}
      <button type="submit" class="btn btn-primary w-100">Reset password</button>
    </form>
  </div>
</div>
{% endblock %}
