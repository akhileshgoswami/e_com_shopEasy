{% extends "emails/base_email.html" %}
{% block email_body %}
<h2>Reset your password</h2>
<p>Hi {{ user.name }}, click the button below to set a new password. This link expires in 1 hour.</p>
<p><a href="{{ reset_url }}" style="display:inline-block;background:#2f5233;color:#fff;padding:10px 20px;border-radius:6px;text-decoration:none;">Reset password</a></p>
<p style="color:#868e96;font-size:13px;">If you didn't request this, you can safely ignore this email.</p>
{% endblock %}
