{% extends "base.html" %}
{% block title %}Something went wrong - {{ site_name }}{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <i class="bi bi-exclamation-triangle display-1 text-muted"></i>
  <h1 class="h3 mt-3">Something went wrong</h1>
  <p class="text-muted">We're sorry, an unexpected error occurred. Our team has been notified.</p>
  <a href="{{ url_for('shop.home') }}" class="btn btn-primary">Back to home</a>
</div>
{% endblock %}
