# Alternative to .github/workflows/deploy.yml for teams using Cloud Build
# instead of GitHub Actions. Provision once with ./scripts/deploy.sh (it
# creates the service, database, bucket and secrets); this file then only
# tests, builds and rolls out new images. Trigger it from a Cloud Build
# GitHub trigger on pushes to main, or run manually:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_REGION=us-central1,_REPO_NAME=ecom-repo,_SERVICE_NAME=ecom-web,SHORT_SHA=$(git rev-parse --short HEAD)

steps:
  # Steps share the "cloudbuild" Docker network, so the emulator started
  # here is reachable as datastore:8081 from the test step.
  - id: start-datastore-emulator
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - -d
      - --name=datastore
      - --network=cloudbuild
      - gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
      - gcloud
      - beta
      - emulators
      - datastore
      - start
      - --host-port=0.0.0.0:8081
      - --project=e-com-test
      - --consistency=1.0
      - --no-store-on-disk

  - id: install-and-test
    name: python:3.12-slim
    entrypoint: bash
    env:
      - DATASTORE_EMULATOR_HOST=datastore:8081
      - DATASTORE_PROJECT_ID=e-com-test
    args:
      - -c
      - |
        pip install -r requirements.txt --quiet
        python -c "import time, urllib.request
        for _ in range(60):
            try:
                urllib.request.urlopen('http://datastore:8081/'); break
            except OSError:
                time.sleep(2)"
        pytest -q

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ecom-web:${SHORT_SHA}"
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ecom-web:${SHORT_SHA}"

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_SERVICE_NAME}"
      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ecom-web:${SHORT_SHA}"
      - "--region=${_REGION}"
      - "--platform=managed"
      - "--quiet"

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/ecom-web:${SHORT_SHA}"

options:
  logging: CLOUD_LOGGING_ONLY
