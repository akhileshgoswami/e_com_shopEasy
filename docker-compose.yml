x-datastore-emulator: &datastore-emulator
  image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:8081/ || exit 1"]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  # Local stand-in for Firestore in Datastore mode (what NDB talks to in production).
  datastore:
    <<: *datastore-emulator
    command: >
      gcloud beta emulators datastore start --host-port=0.0.0.0:8081
      --project=e-com-local --consistency=1.0 --data-dir=/data
    ports:
      - "8081:8081"
    volumes:
      - datastore_data:/data

  # Separate, throwaway emulator for the test suite — tests reset all data,
  # so they must never point at the dev emulator above.
  datastore-test:
    <<: *datastore-emulator
    profiles: ["test"]
    command: >
      gcloud beta emulators datastore start --host-port=0.0.0.0:8081
      --project=e-com-test --consistency=1.0 --no-store-on-disk

  web:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      FLASK_APP: wsgi.py
      FLASK_ENV: development
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-not-for-production}
      DATASTORE_EMULATOR_HOST: datastore:8081
      DATASTORE_PROJECT_ID: e-com-local
      BASE_URL: http://localhost:8000
      PORT: 8080
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      # Lets tunnels (cloudflared/ngrok) pass X-Forwarded-Proto/Host so OAuth
      # callback URLs come out as https://<tunnel-host>. Direct localhost
      # requests send no such headers, so they're unaffected.
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      GCS_ENABLED: "false"
      # Emails are only logged unless you export MAIL_ENABLED=true plus the
      # SMTP settings (see .env.example) before `docker compose up`.
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_SERVER: ${MAIL_SERVER:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USE_TLS: ${MAIL_USE_TLS:-true}
      MAIL_USE_SSL: ${MAIL_USE_SSL:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_DEFAULT_SENDER: ${MAIL_DEFAULT_SENDER:-no-reply@example.com}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
    ports:
      - "8000:8080"
    depends_on:
      datastore:
        condition: service_healthy
    volumes:
      - uploads_data:/app/app/static/uploads
    command: gunicorn -w 2 -k gthread --threads 4 -b 0.0.0.0:8080 'app:create_app()'

volumes:
  datastore_data:
  uploads_data:
